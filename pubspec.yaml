name: kidsphonics
description: KidsPhonics - Mobile App for Grade 1 Learners
publish_to: 'none'
version: 1.0.33+34

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  crypto: ^3.0.7               # Offline salted Parent PIN hashing
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2    # Progress saving
  google_fonts: ^6.1.0          # Nunito + Fredoka One fonts
  provider: ^6.1.1              # State management
  audioplayers: ^6.0.0          # Sound effects
  speech_to_text: ^7.0.0        # Word recognition (not pronunciation scoring)
  permission_handler: ^11.3.1   # Microphone permission

dev_dependencies:
  shared_preferences_platform_interface: ^2.4.2 # Storage failure regression tests
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3 # generates the Android app icon

flutter:
  uses-material-design: true
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/game_words/
    - assets/images/game_logos/
    - assets/images/games_menu/
    - assets/images/progress_collection/
    - assets/images/parent_access/
    - assets/images/lesson_logos/
    - assets/images/lessons_menu/
    - assets/images/letters/
    - assets/images/button_designs/
    - assets/images/answer_choices/
    - assets/images/new_ui/
    - assets/images/screen_transitions/
    - assets/images/quick_check_background/
    - assets/images/game_background/
    - assets/images/lesson_background/
    - assets/images/lesson_header/
    - assets/images/home_mascots/
    - assets/images/home_village/
    - assets/images/activity_cards/
    - assets/images/navigation_buttons/
    - assets/images/school_home/
    - assets/images/home_classroom/
    - assets/images/home_buttons/
    - assets/images/home_banner/
    - assets/images/custom_navigation/
    - assets/images/school_rooms/
    - assets/images/update_scene/
    - assets/images/character_selection/
    - assets/audio/game_words/
    - assets/audio/rhyming_jar/
    - assets/images/rhyming_jar/
    - assets/audio/cvc_lesson/
    - assets/audio/blending_lesson/
    - assets/images/lesson_frames/
    - assets/images/cvc_blending/
    - assets/images/screen_frames/background/
    - assets/images/screen_frames/lessons/
    - assets/images/screen_frames/games/
    - assets/audio/phonics/lesson_audio/letters/
    - assets/audio/phonics/lesson_audio/sounds/
    - assets/audio/phonics/lesson_audio/words/
    - assets/audio/
    - assets/audio/home/
    - assets/audio/home_intro/
    - assets/audio/lesson_instructions/
    - assets/audio/alphabet_pictures/
    - assets/audio/game_instructions/
    - assets/audio/quick_check/
    - assets/audio/phonics/rhyming_words/
    - assets/audio/phonics/word_builder/
    - assets/audio/phonics/say_it_right/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#5636A6"
  adaptive_icon_foreground: "assets/images/app_mascot.png"
  adaptive_icon_foreground_inset: 22


